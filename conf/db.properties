#
# DB
#

# H2 JDBC URL（file 模式）
# 相对路径相对 JVM 工作目录：server.bat 在 work/bin 启动，故用 ../db/ontology
# 当前 db.properties 不支持 ${ENV} / ${server.home} 占位符
jdbcUrl=jdbc:h2:file:../db/ontology;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
# 数据库用户名
username=sa
# 数据库密码（H2 默认空）
password=
# JDBC 驱动类
driverClassName=org.h2.Driver
# 连接池名称
poolName=openont-main
# 最大连接数
maximumPoolSize=10
# 最小空闲连接数
minimumIdle=2
# 获取连接超时（毫秒）
connectionTimeout=30000
# 空闲连接超时（毫秒）
idleTimeout=600000
# 连接最大存活时间（毫秒）
maxLifetime=1800000
# 是否自动提交
autoCommit=false
